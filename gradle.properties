# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment mappings provide readable parameter names and javadoc.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.238
loader_version_range=[1,)

## Mod Properties

# nature_in_a_bottle 是 time_in_a_bottle 的附属：拿时间之瓶右击成熟作物直接收成。
mod_id=nature_in_a_bottle
mod_name=Nature in a Bottle
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.unddefined.natureinabottle
mod_authors=Unddefined
mod_description=Harvest fully grown crops with Time in a Bottle for a multiplied yield.\nRequires Time in a Bottle.

## Dependencies

# Time in a Bottle（CurseForge 项目 895919）。它没有发布到公共 maven，
# 所以用 cursmaven 直接指向 1.21.1 的 tiab-neoforge 文件。
tiab_version=6.5.4
tiab_project_id=895919
# tiab-neoforge-6.5.4.jar
tiab_file_id=7555622
